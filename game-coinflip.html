<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusWin - Coin Flip Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #0b0e14; color: #fff; }
        .glass-panel { background: #141822; border: 1px solid rgba(255, 255, 255, 0.08); }
        .coin { width: 100px; height: 100px; position: relative; transform-style: preserve-3d; transition: transform 1s ease-in-out; margin: 0 auto; }
        .coin-face { position: absolute; width: 100%; height: 100%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 900; backface-visibility: hidden; border: 4px solid #f59e0b; box-shadow: 0 0 20px rgba(245, 158, 11, 0.3); }
        .coin-heads { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: #111827; }
        .coin-tails { background: linear-gradient(135deg, #94a3b8 0%, #475569 100%); color: #fff; transform: rotateY(180deg); }

        @keyframes vipSlideDown {
            0% { transform: translateY(-120%) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes vipSlideUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120%) scale(0.9); opacity: 0; }
        }
        .vip-toast-enter { animation: vipSlideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .vip-toast-exit { animation: vipSlideUp 0.3s ease-in forwards; }
    </style>
</head>
<body class="min-h-screen pb-28">

    <div id="toastContainer" class="fixed top-5 left-0 right-0 z-[9999] flex justify-center pointer-events-none px-4"></div>

    <header class="sticky top-0 z-50 bg-[#12151c]/95 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <button onclick="goBack()" class="w-9 h-9 rounded-xl bg-slate-800 flex items-center justify-center font-bold text-white hover:bg-slate-700 cursor-pointer">←</button>
            <div>
                <h2 class="text-xs font-black text-amber-500 uppercase tracking-wider">🪙 Coin Flip Pro</h2>
                <span class="text-[10px] text-emerald-400 font-semibold">● Ultra Stable & Working</span>
            </div>
        </div>
        <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3.5 py-1.5 rounded-full shadow-inner">
            <span class="text-[10px] uppercase font-bold text-slate-400">Bal:</span>
            <span id="userBalance" class="text-xs font-black text-emerald-400">₹0.00</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <div class="glass-panel rounded-2xl p-3 grid grid-cols-2 gap-2 text-center">
            <div>
                <span class="text-[9px] text-slate-400 font-bold uppercase block">Multiplier</span>
                <span class="text-base font-black text-amber-400">1.85x</span>
            </div>
            <div>
                <span class="text-[9px] text-slate-400 font-bold uppercase block">Win Chance</span>
                <span class="text-base font-black text-emerald-400">Smart Risk</span>
            </div>
        </div>

        <div class="glass-panel rounded-3xl p-8 text-center relative overflow-hidden bg-gradient-to-b from-slate-900 to-[#0d151f]">
            <span class="text-[10px] uppercase font-bold text-slate-500 tracking-widest block mb-6">Flip Result</span>
            <div id="coinContainer" class="coin mb-4">
                <div class="coin-face coin-heads">H</div>
                <div class="coin-face coin-tails">T</div>
            </div>
            <div id="resultText" class="text-xs font-extrabold text-slate-300 uppercase tracking-wider mt-4">Choose Heads or Tails and flip!</div>
        </div>

        <div class="glass-panel rounded-3xl p-4 space-y-3">
            <span class="text-xs font-bold text-slate-300 uppercase block">Select Side</span>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="selectSide('HEADS')" id="btnHeads" class="side-btn py-3 rounded-2xl bg-amber-500 text-slate-950 font-extrabold text-xs uppercase tracking-wider shadow-lg shadow-amber-500/20 transition-all cursor-pointer">Heads (H)</button>
                <button onclick="selectSide('TAILS')" id="btnTails" class="side-btn py-3 rounded-2xl bg-slate-800 text-slate-400 font-extrabold text-xs uppercase tracking-wider transition-all cursor-pointer">Tails (T)</button>
            </div>
        </div>

        <div class="glass-panel rounded-3xl p-4 space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-slate-300 uppercase">Bet Amount (₹)</span>
            </div>
            
            <input type="number" id="betAmount" value="10" class="w-full bg-[#0b0e14] border border-slate-800 rounded-2xl px-4 py-2.5 text-xs text-white font-semibold focus:outline-none focus:border-amber-500 transition-all">

            <!-- Quick Bets -->
            <div class="space-y-1.5">
                <div class="grid grid-cols-4 gap-1.5">
                    <button onclick="chooseBet(10)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-slate-300 border border-slate-700/50 cursor-pointer">10</button>
                    <button onclick="chooseBet(20)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-slate-300 border border-slate-700/50 cursor-pointer">20</button>
                    <button onclick="chooseBet(50)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-slate-300 border border-slate-700/50 cursor-pointer">50</button>
                    <button onclick="chooseBet(100)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-slate-300 border border-slate-700/50 cursor-pointer">100</button>
                </div>

                <div class="grid grid-cols-4 gap-1.5">
                    <button onclick="chooseBet(300)" class="quick-btn py-1.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-amber-400 border border-slate-700/50 cursor-pointer">300</button>
                    <button onclick="chooseBet(500)" class="quick-btn py-1.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-amber-400 border border-slate-700/50 cursor-pointer">500</button>
                    <button onclick="chooseBet(700)" class="quick-btn py-1.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-amber-400 border border-slate-700/50 cursor-pointer">700</button>
                    <button onclick="chooseBet(1000)" class="quick-btn py-1.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-amber-400 border border-slate-700/50 cursor-pointer">1000</button>
                </div>
            </div>

            <div class="pt-1">
                <button id="flipBtn" onclick="flipCoin()" class="w-full py-3.5 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs uppercase tracking-widest shadow-lg shadow-amber-500/20 transition-all cursor-pointer">FLIP COIN</button>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyC4d_UnCWkmKc3D65HjxvAGvJ4A5GXFIQQ", authDomain: "nexuswin-aa829.firebaseapp.com", databaseURL: "https://nexuswin-aa829-default-rtdb.firebaseio.com", projectId: "nexuswin-aa829", storageBucket: "nexuswin-aa829.firebasestorage.app", messagingSenderId: "865579357605", appId: "1:865579357605:web:7af15e869ce54756a8844c" };
        
        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getDatabase(app);
        } catch(e) {
            console.log("Firebase Init Error:", e);
        }

        let currentUser = null, userBalance = 0, userWinningBalance = 0, userTurnover = 0, userGameControl = 'normal', selectedChoice = 'HEADS', isFlipping = false;
        let spinHistoryCount = 0;

        // --- WEB AUDIO SYSTEM ---
        let audioCtx = null;
        function getAudioContext() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) {}
            return audioCtx;
        }

        window.playCustomSound = function(actionType) {
            try {
                const ctx = getAudioContext();
                if(!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                const now = ctx.currentTime;

                if (actionType === 'chip') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.09);
                    osc.start(now);
                    osc.stop(now + 0.09);
                } else if (actionType === 'side') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.setValueAtTime(900, now + 0.05);
                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (actionType === 'start') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(450, now);
                    osc.frequency.linearRampToValueAtTime(250, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (actionType === 'back') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                }
            } catch(e) {}
        }

        window.playSound = function(type) {
            try {
                const ctx = getAudioContext();
                if(!ctx) return;
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();
                osc.connect(gainNode);
                gainNode.connect(ctx.destination);
                const now = ctx.currentTime;

                if (type === 'flip') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(1500, now + 0.55);
                    gainNode.gain.setValueAtTime(0.55, now);
                    gainNode.gain.linearRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.12);
                    osc.frequency.setValueAtTime(783.99, now + 0.24);
                    osc.frequency.setValueAtTime(1046.50, now + 0.36);
                    gainNode.gain.setValueAtTime(0.6, now);
                    gainNode.gain.linearRampToValueAtTime(0.01, now + 0.7);
                    osc.start(now);
                    osc.stop(now + 0.7);
                } else if (type === 'lose') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(90, now + 0.4);
                    gainNode.gain.setValueAtTime(0.45, now);
                    gainNode.gain.linearRampToValueAtTime(0.01, now + 0.45);
                    osc.start(now);
                    osc.stop(now + 0.45);
                }
            } catch(e) {}
        }

        window.chooseBet = function(amt) {
            if(isFlipping) return;
            playCustomSound('chip');
            document.getElementById('betAmount').value = amt;
        }

        window.selectSide = function(choice) {
            if(isFlipping) return;
            playCustomSound('side');
            selectedChoice = choice;
            document.getElementById('btnHeads').className = choice === 'HEADS' ? "side-btn py-3 rounded-2xl bg-amber-500 text-slate-950 font-extrabold text-xs uppercase tracking-wider shadow-lg shadow-amber-500/20 transition-all cursor-pointer" : "side-btn py-3 rounded-2xl bg-slate-800 text-slate-400 font-extrabold text-xs uppercase tracking-wider transition-all cursor-pointer";
            document.getElementById('btnTails').className = choice === 'TAILS' ? "side-btn py-3 rounded-2xl bg-amber-500 text-slate-950 font-extrabold text-xs uppercase tracking-wider shadow-lg shadow-amber-500/20 transition-all cursor-pointer" : "side-btn py-3 rounded-2xl bg-slate-800 text-slate-400 font-extrabold text-xs uppercase tracking-wider transition-all cursor-pointer";
        }

        window.goBack = function() {
            playCustomSound('back');
            window.location.href = 'dashboard.html';
        }

        window.showVipToast = function(title, message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if(!container) return;
            container.innerHTML = ''; 
            
            const toast = document.createElement('div');
            let bgGradient = 'linear-gradient(135deg, #0f172aee 0%, #090d16ee 100%)';
            let borderColor = '#334155';
            let icon = '🪙';
            let titleColor = 'text-white';

            if(type === 'success') {
                bgGradient = 'linear-gradient(135deg, #064e3b 0%, #022c22 100%)';
                borderColor = '#10b981';
                icon = '🏆';
                titleColor = 'text-emerald-400';
            } else if(type === 'error') {
                bgGradient = 'linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%)';
                borderColor = '#f43f5e';
                icon = '🚨';
                titleColor = 'text-rose-400';
            }

            toast.className = `pointer-events-auto flex items-center gap-4 px-5 py-4 rounded-3xl shadow-2xl backdrop-blur-2xl border-2 vip-toast-enter max-w-sm w-full mx-4`;
            toast.style.background = bgGradient;
            toast.style.borderColor = borderColor;
            toast.style.boxShadow = `0 20px 40px rgba(0,0,0,0.6), 0 0 20px ${borderColor}44`;
            
            toast.innerHTML = `
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl bg-black/30 border border-white/10 shrink-0 shadow-inner">
                    ${icon}
                </div>
                <div class="flex-1">
                    <div class="text-[13px] font-black uppercase tracking-wider ${titleColor}">${title}</div>
                    <div class="text-xs font-semibold text-slate-200 mt-0.5">${message}</div>
                </div>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('vip-toast-enter');
                toast.classList.add('vip-toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        if(auth) {
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    currentUser = user;
                    setupDatabaseListener(user.uid);
                } else {
                    try {
                        const cred = await signInAnonymously(auth);
                        currentUser = cred.user;
                        setupDatabaseListener(currentUser.uid);
                    } catch(err) {
                        userBalance = 0;
                        updateBalanceUI();
                    }
                }
            });
        } else {
            userBalance = 0;
            updateBalanceUI();
        }

        function setupDatabaseListener(uid) {
            try {
                const userRef = ref(db, 'users/' + uid);
                onValue(userRef, (snap) => {
                    if(snap.exists()) {
                        const val = snap.val();
                        // सीधे डेटाबेस वाली वैल्यू बिना किसी साइंटिफिक नोटेशन कन्वर्शन के उठा रहे हैं
                        userBalance = val.balance !== undefined ? val.balance : 0;
                        
                        userWinningBalance = Number(val.winningBalance || 0);
                        userTurnover = Number(val.turnover || 0);
                        if(val.gameControls && val.gameControls.coin_flip) {
                            userGameControl = val.gameControls.coin_flip;
                        }
                    } else {
                        set(userRef, { balance: 0, winningBalance: 0, turnover: 0 });
                        userBalance = 0;
                    }
                    updateBalanceUI();
                }, (error) => {
                    updateBalanceUI();
                });
            } catch(e) {
                updateBalanceUI();
            }
        }

        function updateBalanceUI() {
            const balEl = document.getElementById('userBalance');
            if(balEl) {
                // डैशबोर्ड की तरह ही फॉर्मेट में शो होगा
                if (typeof userBalance === 'number') {
                    balEl.innerText = `₹${userBalance > 999999 ? userBalance.toExponential(2) : userBalance.toFixed(2)}`;
                } else {
                    balEl.innerText = `₹${userBalance}`;
                }
            }
        }

        function toggleControls(disable) {
            isFlipping = disable;
            const input = document.getElementById('betAmount');
            if(input) input.disabled = disable;

            const allBtns = document.querySelectorAll('.quick-btn, .side-btn, #flipBtn');
            allBtns.forEach(btn => {
                btn.disabled = disable;
                if(disable) {
                    btn.classList.add('opacity-40', 'cursor-not-allowed');
                } else {
                    btn.classList.remove('opacity-40', 'cursor-not-allowed');
                }
            });
        }

        window.flipCoin = async function() {
            if(isFlipping) return;
            playCustomSound('start');

            let betInput = document.getElementById('betAmount');
            let bet = betInput ? parseFloat(betInput.value) : 10;
            
            let numericBal = Number(userBalance);
            if(!bet || bet < 10) { 
                showVipToast("Invalid Bet", "Minimum bet amount is ₹10", "error"); 
                return; 
            }
            if(bet > numericBal) { 
                showVipToast("Low Balance", "Insufficient wallet balance to place bet!", "error"); 
                return; 
            }

            toggleControls(true);
            
            let turnoverIncrement = bet * 0.30;
            userBalance = numericBal - bet;
            userTurnover += turnoverIncrement;
            updateBalanceUI();

            if(currentUser && db) {
                try {
                    await update(ref(db, `users/${currentUser.uid}`), { 
                        balance: userBalance,
                        turnover: userTurnover
                    });
                } catch(e) {}
            }

            const resText = document.getElementById('resultText');
            if(resText) resText.innerHTML = `<span class="text-amber-400">Flipping coin...</span>`;

            playSound('flip');

            let isWin = false;
            spinHistoryCount++;

            if (userGameControl === 'win') {
                isWin = true;
            } else if (userGameControl === 'lose') {
                isWin = false;
            } else {
                if (bet <= 50) {
                    isWin = (spinHistoryCount % 3 === 0) ? (Math.random() < 0.5) : (Math.random() < 0.20);
                } else if (bet > 50 && bet <= 200) {
                    isWin = (spinHistoryCount % 5 === 0) ? (Math.random() < 0.3) : (Math.random() < 0.12);
                } else {
                    isWin = (spinHistoryCount % 8 === 0) ? (Math.random() < 0.2) : (Math.random() < 0.05);
                }
            }

            let outcome = isWin ? selectedChoice : (selectedChoice === 'HEADS' ? 'TAILS' : 'HEADS');

            const coin = document.getElementById('coinContainer');
            if(coin) coin.style.transform = "rotateY(1080deg)";

            setTimeout(async () => {
                if(coin) coin.style.transform = outcome === 'HEADS' ? "rotateY(0deg)" : "rotateY(180deg)";
                
                if(isWin) {
                    let totalPayout = bet * 1.85; 
                    let netProfit = totalPayout - bet;
                    let allowableWinning = netProfit > 0 ? netProfit * 0.40 : 0;

                    userBalance = Number(userBalance) + totalPayout;
                    userWinningBalance += allowableWinning;
                    updateBalanceUI();

                    if(currentUser && db) {
                        try {
                            await update(ref(db, `users/${currentUser.uid}`), { 
                                balance: userBalance,
                                winningBalance: userWinningBalance
                            });
                        } catch(e) {}
                    }

                    playSound('win');

                    showVipToast("Big Win!", `Won ₹${totalPayout.toFixed(2)}! Coin landed on ${outcome}`, "success");
                    if(resText) resText.innerHTML = `<span class="text-emerald-400">🎉 Won ₹${totalPayout.toFixed(2)}! Coin landed on ${outcome}</span>`;
                } else {
                    playSound('lose');

                    showVipToast("Round Lost", `Coin landed on ${outcome}. Better luck next time!`, "error");
                    if(resText) resText.innerHTML = `<span class="text-red-400">💥 Lost! Coin landed on ${outcome}</span>`;
                }
                
                toggleControls(false);
            }, 1000);
        }
    </script>
</body>
</html>
