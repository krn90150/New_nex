<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusWin - Deposit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .glass-panel { background: rgba(13, 17, 28, 0.85); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7); }
        #toastBox { transition: transform 0.3s ease, opacity 0.3s ease; }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen p-4 flex flex-col justify-between">

    <!-- Toast -->
    <div id="toastBox" class="fixed top-5 left-1/2 -translate-x-1/2 z-[100] bg-rose-600 text-white px-5 py-3 rounded-2xl shadow-2xl text-xs font-bold tracking-wide transform -translate-y-20 opacity-0 pointer-events-none flex items-center gap-2 border border-rose-400/30">
        <span>⚠️</span> <span id="toastMsg">Error message here</span>
    </div>

    <div class="max-w-md mx-w-full w-full max-w-sm mx-auto space-y-4 my-auto">
        <div class="glass-panel rounded-[2.5rem] p-6 border border-slate-800 relative">
            <button onclick="window.location.href='dashboard.html'" class="absolute top-5 right-5 text-slate-400 hover:text-white font-bold text-sm">✕</button>
            <h3 class="text-base font-extrabold text-white mb-1">Manual Deposit</h3>
            <p class="text-[11px] text-slate-400 mb-4">Minimum Deposit: ₹100. Scan QR code or pay to UPI ID, then enter your UTR transaction ID.</p>
            
            <div class="bg-white p-4 rounded-3xl flex flex-col items-center justify-center mb-4 shadow-xl">
                <img src="76407.png" alt="UPI QR Code" class="w-40 h-40 object-contain mb-2 rounded-xl">
                <span class="text-xs font-bold text-slate-900 select-all bg-slate-100 px-3 py-1 rounded-xl">krn90150-2@oksbi</span>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Amount (₹)</label>
                    <input type="number" id="depositAmount" placeholder="Min ₹100" class="w-full bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-xs text-white font-semibold focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">12-Digit UTR Number</label>
                    <input type="text" id="depositUtr" placeholder="Enter UTR / Ref ID" class="w-full bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-xs text-white font-semibold focus:outline-none focus:border-indigo-500">
                </div>
                <button onclick="submitDepositRequest()" class="w-full py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs uppercase tracking-wider shadow-lg shadow-emerald-600/30 transition-all">Submit Deposit Request</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, set, query, orderByChild, equalTo, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4d_UnCWkmKc3D65HjxvAGvJ4A5GXFIQQ",
            authDomain: "nexuswin-aa829.firebaseapp.com",
            databaseURL: "https://nexuswin-aa829-default-rtdb.firebaseio.com",
            projectId: "nexuswin-aa829",
            storageBucket: "nexuswin-aa829.firebasestorage.app",
            messagingSenderId: "865579357605",
            appId: "1:865579357605:web:7af15e869ce54756a8844c",
            measurementId: "G-NTZY5VKYP0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        let currentUserEmail = "";

        onAuthStateChanged(auth, (user) => {
            if (user) { currentUserEmail = user.email || "Gamer"; }
            else { window.location.href = "index.html"; }
        });

        function showToast(msg) {
            const toast = document.getElementById('toastBox');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('-translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 3000);
        }

        window.submitDepositRequest = async function() {
            try {
                const user = auth.currentUser;
                if (!user) { showToast("Session expired!"); return; }
                const amount = parseFloat(document.getElementById('depositAmount').value);
                const utr = document.getElementById('depositUtr').value.trim();

                if (!amount || !utr || amount < 100 || utr.length < 6) {
                    showToast("Please enter valid amount (Min ₹100) & UTR.");
                    return;
                }

                const depositsRef = ref(db, 'transactions/deposits');
                const utrQuery = query(depositsRef, orderByChild('utr'), equalTo(utr));
                const snapshot = await get(utrQuery);
                if (snapshot.exists()) { showToast("❌ UTR already submitted!"); return; }

                const newReq = push(depositsRef);
                await set(newReq, { uid: user.uid, email: currentUserEmail, amount: amount, utr: utr, status: 'Pending', timestamp: Date.now() });

                showToast("✅ Deposit request submitted!");
                setTimeout(() => window.location.href = 'dashboard.html', 1500);
            } catch (error) { showToast("Error: " + error.message); }
        }
    </script>
</body>
</html>
