<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusWin - Endless Ladder Climber</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #060913; color: #fff; user-select: none; }
        .glass-panel { background: rgba(13, 17, 28, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        canvas { background: radial-gradient(circle at center, #0f172a 0%, #030712 100%); border-radius: 20px; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
        #toastBox { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="min-h-screen pb-24 flex flex-col justify-between">

    <!-- Toast Notification -->
    <div id="toastBox" class="fixed top-5 left-1/2 -translate-x-1/2 z-[100] w-[90%] max-w-[360px] bg-[#220d0f]/95 backdrop-blur-xl border border-rose-500/30 px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3.5 transform -translate-y-20 opacity-0 pointer-events-none">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-rose-600 to-red-700 flex items-center justify-center shrink-0 shadow-lg text-xl">🚨</div>
        <div class="flex flex-col justify-center">
            <span id="toastTitle" class="text-[9px] font-extrabold tracking-widest text-rose-400 uppercase">NEXUSWIN</span>
            <span id="toastMsg" class="text-xs font-bold text-slate-100 leading-tight mt-0.5">Message</span>
        </div>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-panel border-b border-slate-800 px-4 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='dashboard.html'" class="w-9 h-9 rounded-xl bg-slate-800 flex items-center justify-center font-bold text-white">←</button>
            <div class="flex items-center gap-2">
               <svg class="w-6 h-6 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 2v20M16 2v20M4 6h16M4 11h16M4 16h16"/></svg>
               <div>
                  <h2 class="text-xs font-black text-cyan-400 uppercase tracking-wider">Endless Climber</h2>
                  <span class="text-[10px] text-emerald-400 font-semibold" id="onlinePlayersCount">● Active Players: 42</span>
               </div>
            </div>
        </div>
        <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3.5 py-1.5 rounded-full">
            <span class="text-[10px] uppercase font-bold text-slate-400">Bal:</span>
            <span id="userBalance" class="text-xs font-black text-emerald-400">₹0.00</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto w-full p-4 space-y-4">
        
        <!-- Game Arena Canvas Box -->
        <div class="glass-panel rounded-3xl p-3 flex flex-col items-center relative overflow-hidden">
            <div class="w-full flex justify-between items-center mb-2 px-2">
                <span class="text-[11px] font-bold text-slate-400">Step: <strong id="stepDisplay" class="text-cyan-400">0</strong></span>
                <span class="text-[11px] font-bold text-slate-400">Multiplier: <strong id="multDisplay" class="text-amber-400">1.00x</strong></span>
            </div>

            <!-- Canvas for Real Ladder & Jumping Character -->
            <div class="relative w-[300px] h-[340px]">
                <canvas id="gameCanvas" width="300" height="340"></canvas>

                <!-- Result Modal -->
                <div id="vipResultModal" class="absolute inset-0 bg-slate-950/95 backdrop-blur-lg rounded-2xl flex flex-col items-center justify-center p-6 text-center z-30 hidden">
                    <div id="vipModalIcon" class="w-16 h-16 rounded-3xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-3xl mb-3">🏆</div>
                    <h3 id="vipModalTitle" class="text-sm font-black text-amber-400 uppercase tracking-widest mb-1">VICTORY</h3>
                    <p id="vipModalDesc" class="text-xs text-slate-300 mb-4 font-medium">Cashed out successfully!</p>
                    <div class="w-full bg-slate-900/90 border border-amber-500/30 rounded-2xl p-3 mb-5">
                        <span class="text-[10px] text-slate-400 uppercase font-bold block">Total Credited Payout</span>
                        <span id="vipModalAmount" class="text-xl font-black text-emerald-400">₹0.00</span>
                    </div>
                    <button onclick="closeVipModal()" class="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 text-slate-950 font-black text-xs uppercase">
                        PLAY AGAIN
                    </button>
                </div>
            </div>

            <div id="gameStatusText" class="mt-2 text-center text-xs font-bold text-amber-300">
                Select difficulty & place bet to start!
            </div>
        </div>

        <!-- Controls Panel -->
        <div class="glass-panel rounded-3xl p-4 space-y-3">
            <!-- Difficulty -->
            <div>
                <span class="text-xs font-bold text-slate-300 uppercase block mb-1.5">Difficulty Level (Risk & Reward)</span>
                <div class="grid grid-cols-4 gap-1.5">
                    <button type="button" onclick="setDifficulty('easy')" id="btnEasy" class="py-2 bg-cyan-600 text-slate-950 font-black text-[10px] rounded-xl uppercase">Easy</button>
                    <button type="button" onclick="setDifficulty('medium')" id="btnMedium" class="py-2 bg-slate-800 text-slate-300 font-black text-[10px] rounded-xl uppercase">Med</button>
                    <button type="button" onclick="setDifficulty('hard')" id="btnHard" class="py-2 bg-slate-800 text-slate-300 font-black text-[10px] rounded-xl uppercase">Hard</button>
                    <button type="button" onclick="setDifficulty('expert')" id="btnExpert" class="py-2 bg-slate-800 text-slate-300 font-black text-[10px] rounded-xl uppercase">Expert</button>
                </div>
            </div>

            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-slate-300 uppercase">Bet Amount (₹)</span>
                <div class="flex gap-1">
                    <button type="button" onclick="setBet(10)" class="px-2.5 py-1 bg-slate-800 rounded-lg text-[10px] font-bold text-cyan-400">10</button>
                    <button type="button" onclick="setBet(50)" class="px-2.5 py-1 bg-slate-800 rounded-lg text-[10px] font-bold text-cyan-400">50</button>
                    <button type="button" onclick="setBet(100)" class="px-2.5 py-1 bg-slate-800 rounded-lg text-[10px] font-bold text-cyan-400">100</button>
                </div>
            </div>
            <input type="number" id="betAmount" value="10" class="w-full bg-[#05070a] border border-slate-800 rounded-2xl px-4 py-3 text-xs text-white font-bold">
            
            <div class="grid grid-cols-3 gap-2">
                <button id="startBtn" onclick="startGame()" class="py-3.5 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-black text-xs uppercase shadow-lg">
                    START
                </button>
                <button id="jumpBtn" onclick="playerJump()" disabled class="py-3.5 rounded-2xl bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-black text-xs uppercase opacity-50 cursor-not-allowed shadow-lg">
                    JUMP ↗
                </button>
                <button id="cashoutBtn" onclick="cashOut()" disabled class="py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 text-slate-950 font-black text-xs uppercase opacity-50 cursor-not-allowed shadow-lg">
                    CASH OUT
                </button>
            </div>
        </div>
    </main>

    <!-- Firebase Logic & Game Engine -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4d_UnCWkmKc3D65HjxvAGvJ4A5GXFIQQ",
            authDomain: "nexuswin-aa829.firebaseapp.com",
            databaseURL: "https://nexuswin-aa829-default-rtdb.firebaseio.com",
            projectId: "nexuswin-aa829",
            storageBucket: "nexuswin-aa829.firebasestorage.app",
            messagingSenderId: "865579357605",
            appId: "1:865579357605:web:7af15e869ce54756a8844c",
            measurementId: "G-NTZY5VKYP0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;
        let userBalance = 0;
        let userWinningBalance = 0;
        let userTurnover = 0;

        let selectedDifficulty = 'easy';
        let gameActive = false;
        let currentBet = 0;
        let stepCount = 0;
        let currentMultiplier = 1.00;
        let idleTimer = null;
        let scrollOffset = 0;
        let jumpProgress = 1;
        let bgBeatInterval = null;

        // Admin risk rates (ab easy aur med mein bhi early break ke liye risk high rakha hai)
        let adminRiskRates = { easy: 0.35, medium: 0.50, hard: 0.70, expert: 0.85 };

        const diffMultiplierConfig = {
            easy: { inc: 0.05 },     
            medium: { inc: 0.08 },   
            hard: { inc: 0.12 },     
            expert: { inc: 0.18 }    
        };

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playJumpSound() {
            initAudio();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        }

        function playCrashSound() {
            initAudio();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        function startBackgroundBeat() {
            if (bgBeatInterval) clearInterval(bgBeatInterval);
            bgBeatInterval = setInterval(() => {
                if (!gameActive) { clearInterval(bgBeatInterval); return; }
                initAudio();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            }, 800);
        }

        function showToast(title, msg) {
            const toast = document.getElementById('toastBox');
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('-translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 3000);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                onValue(ref(db, 'users/' + user.uid), (snap) => {
                    if(snap.exists()) {
                        const data = snap.val();
                        userBalance = Number(data.balance || 0);
                        userWinningBalance = Number(data.winningBalance || 0);
                        userTurnover = Number(data.turnover || 0);
                        document.getElementById('userBalance').innerText = `₹${userBalance.toFixed(2)}`;
                    }
                });

                onValue(ref(db, 'adminSettings/ladderClimber'), (snap) => {
                    if(snap.exists()) {
                        const val = snap.val();
                        if(val.riskConfig) adminRiskRates = val.riskConfig;
                    }
                });

            } else {
                window.location.href = "index.html";
            }
        });

        window.setDifficulty = (diff) => {
            if(gameActive) return;
            selectedDifficulty = diff;
            ['easy', 'medium', 'hard', 'expert'].forEach(d => {
                const btn = document.getElementById(`btn${d.charAt(0).toUpperCase() + d.slice(1)}`);
                if(d === diff) {
                    btn.className = "py-2 bg-cyan-600 text-slate-950 font-black text-[10px] rounded-xl uppercase shadow-lg";
                } else {
                    btn.className = "py-2 bg-slate-800 text-slate-300 font-black text-[10px] rounded-xl uppercase";
                }
            });
        }

        window.setBet = (amt) => { document.getElementById('betAmount').value = amt; }

        window.startGame = async function() {
            if(gameActive) return;
            let bet = parseFloat(document.getElementById('betAmount').value);
            if(!bet || bet < 10) { showToast("WARNING", "Minimum bet is ₹10"); return; }
            if(bet > userBalance) { showToast("WARNING", "Insufficient Balance!"); return; }

            // Turnover rule: 30% of bet
            let turnoverIncrement = bet * 0.30;
            userBalance -= bet;
            userTurnover += turnoverIncrement; 
            currentBet = bet;
            gameActive = true;
            stepCount = 0;
            currentMultiplier = 1.00;
            scrollOffset = 0;

            await update(ref(db, `users/${currentUser.uid}`), { 
                balance: userBalance,
                turnover: userTurnover
            });

            document.getElementById('startBtn').disabled = true;
            document.getElementById('startBtn').classList.add('opacity-50');
            document.getElementById('jumpBtn').disabled = false;
            document.getElementById('jumpBtn').classList.remove('opacity-50', 'cursor-not-allowed');
            document.getElementById('cashoutBtn').disabled = false;
            document.getElementById('cashoutBtn').classList.remove('opacity-50', 'cursor-not-allowed');

            startBackgroundBeat();
            drawGameScene(false);
            startIdleTimer();
        }

        // STRICT IDLE TIMER: If user waits more than 2 seconds, ladder breaks automatically!
        function startIdleTimer() {
            if(idleTimer) clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                if(gameActive) {
                    triggerBreakAnimation("Stair broke due to delayed action!");
                }
            }, 2000); 
        }

        window.playerJump = function() {
            if(!gameActive) return;
            startIdleTimer();
            playJumpSound();

            let riskFactor = adminRiskRates[selectedDifficulty] || 0.40;
            
            // EARLY BREAK FOR ALL LEVELS: Even on Easy/Med, step 1 or 2 can break instantly
            if (stepCount >= 1 && Math.random() < riskFactor) {
                triggerBreakAnimation("Ladder snapped unexpectedly!");
                return;
            }

            let startTime = performance.now();
            function animateJump(currentTime) {
                let elapsed = currentTime - startTime;
                jumpProgress = Math.min(elapsed / 250, 1);
                drawGameScene(false);
                if (jumpProgress < 1) {
                    requestAnimationFrame(animateJump);
                } else {
                    jumpProgress = 1;
                }
            }
            requestAnimationFrame(animateJump);

            stepCount++;
            currentMultiplier += diffMultiplierConfig[selectedDifficulty].inc;
            scrollOffset += 50;

            document.getElementById('stepDisplay').innerText = stepCount;
            document.getElementById('multDisplay').innerText = `${currentMultiplier.toFixed(2)}x`;
        }

        function drawGameScene(isBroken) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let leftX = 90;
            let rightX = 210;

            ctx.strokeStyle = "#38bdf8";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(leftX, 0); ctx.lineTo(leftX, canvas.height);
            ctx.moveTo(rightX, 0); ctx.lineTo(rightX, canvas.height);
            ctx.stroke();

            for(let i = -2; i < 8; i++) {
                let baseY = canvas.height - 70 - (i * 50) + (scrollOffset % 50);
                let stepMult = Math.max(1.00, currentMultiplier + ((i - 1) * diffMultiplierConfig[selectedDifficulty].inc));

                if(isBroken && i === 1) {
                    ctx.strokeStyle = "#f43f5e";
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.moveTo(leftX, baseY); ctx.lineTo(leftX + 40, baseY - 20);
                    ctx.moveTo(rightX, baseY); ctx.lineTo(rightX - 40, baseY + 20);
                    ctx.stroke();
                } else {
                    ctx.strokeStyle = i === 1 ? "#f59e0b" : "#475569";
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.moveTo(leftX, baseY); ctx.lineTo(rightX, baseY);
                    ctx.stroke();

                    ctx.fillStyle = i === 1 ? "#f59e0b" : "#94a3b8";
                    ctx.font = "bold 11px Outfit";
                    ctx.textAlign = "center";
                    ctx.fillText(`${stepMult.toFixed(2)}x`, canvas.width / 2, baseY - 8);
                }
            }

            let baseCharY = canvas.height - 115;
            let jumpOffset = Math.sin(jumpProgress * Math.PI) * 30;
            let charY = baseCharY - jumpOffset;

            if(!isBroken) {
                ctx.fillStyle = "#10b981";
                ctx.beginPath();
                ctx.arc(canvas.width / 2, charY - 12, 9, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#06b6d4";
                ctx.fillRect(canvas.width / 2 - 7, charY - 3, 14, 18);
                
                ctx.fillStyle = "#fff";
                ctx.fillRect(canvas.width / 2 - 4, charY - 14, 3, 3);
            } else {
                ctx.fillStyle = "#f43f5e";
                ctx.beginPath();
                ctx.arc(canvas.width / 2 + 15, baseCharY + 30, 9, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        window.cashOut = function() {
            if(!gameActive) return;
            let payout = currentBet * currentMultiplier;
            endGame(true, payout);
        }

        function triggerBreakAnimation(reason) {
            gameActive = false;
            if(idleTimer) clearTimeout(idleTimer);
            if(bgBeatInterval) clearInterval(bgBeatInterval);
            playCrashSound();

            drawGameScene(true);

            setTimeout(() => {
                endGame(false, reason);
            }, 800);
        }

        async function endGame(won, dataVal) {
            gameActive = false;
            if(idleTimer) clearTimeout(idleTimer);
            if(bgBeatInterval) clearInterval(bgBeatInterval);

            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtn').classList.remove('opacity-50');
            document.getElementById('jumpBtn').disabled = true;
            document.getElementById('jumpBtn').classList.add('opacity-50', 'cursor-not-allowed');
            document.getElementById('cashoutBtn').disabled = true;
            document.getElementById('cashoutBtn').classList.add('opacity-50', 'cursor-not-allowed');

            const modal = document.getElementById('vipResultModal');
            const modalIcon = document.getElementById('vipModalIcon');
            const modalTitle = document.getElementById('vipModalTitle');
            const modalAmount = document.getElementById('vipModalAmount');
            const modalDesc = document.getElementById('vipModalDesc');

            if(won) {
                let totalPayout = dataVal; 
                let netProfit = totalPayout - currentBet; 
                
                // 60% Net Profit Rule for Withdraw Balance
                let allowableWinning = netProfit > 0 ? netProfit * 0.60 : 0; 

                userBalance += totalPayout; 
                userWinningBalance += allowableWinning; 

                await update(ref(db, `users/${currentUser.uid}`), {
                    balance: userBalance,
                    winningBalance: userWinningBalance
                });

                modalIcon.innerText = "🏆";
                modalTitle.innerText = "SUCCESSFUL CASH OUT";
                modalDesc.innerText = "Cashed out safely before crash!";
                modalAmount.innerText = `+₹${totalPayout.toFixed(2)}`;
                modalAmount.className = "text-xl font-black text-emerald-400";
            } else {
                modalIcon.innerText = "💥";
                modalTitle.innerText = "LADDER CRASHED!";
                modalDesc.innerText = dataVal;
                modalAmount.innerText = `-₹${currentBet.toFixed(2)}`;
                modalAmount.className = "text-xl font-black text-rose-500";
            }
            modal.classList.remove('hidden');
        }

        window.closeVipModal = () => document.getElementById('vipResultModal').classList.add('hidden');
    </script>
</body>
</html>
