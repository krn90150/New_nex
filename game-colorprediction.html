<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusWin - 99 Club Color Prediction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #05070a; color: #fff; }
        .glass-panel { background: linear-gradient(135deg, #0f172a 0%, #090d16 100%); border: 1px solid rgba(255, 255, 255, 0.08); }
        
        @keyframes vipSlideDown {
            0% { transform: translateY(-120%) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes vipSlideUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120%) scale(0.9); opacity: 0; }
        }
        .vip-toast-enter { animation: vipSlideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .vip-toast-exit { animation: vipSlideUp 0.3s ease-in forwards; }
    </style>
</head>
<body class="min-h-screen pb-28">

    <div id="toastContainer" class="fixed top-5 left-0 right-0 z-[9999] flex justify-center pointer-events-none px-4"></div>

    <header class="sticky top-0 z-50 bg-[#090d16]/95 backdrop-blur-md border-b border-slate-800/80 px-4 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <button onclick="goBack()" class="w-9 h-9 rounded-xl bg-slate-800/80 flex items-center justify-center font-bold text-white hover:bg-slate-700 cursor-pointer">←</button>
            <div>
               <h2 class="text-xs font-black text-amber-400 uppercase tracking-wider">🎨 99 Club Color Prediction</h2>
               <span class="text-[10px] text-emerald-400 font-semibold">● 15s VIP Fast Round</span>
            </div>
        </div>
        <div class="flex items-center gap-2 bg-slate-900/90 border border-slate-800 px-3.5 py-1.5 rounded-full shadow-inner">
            <span class="text-[10px] uppercase font-bold text-slate-400">Bal:</span>
            <span id="userBalance" class="text-xs font-black text-emerald-400">₹0.00</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <div class="glass-panel rounded-3xl p-4 relative overflow-hidden shadow-2xl space-y-4">
            
            <div class="flex justify-between items-center bg-slate-950/80 py-2.5 px-4 rounded-2xl border border-slate-800">
                <div>
                    <span class="text-[10px] uppercase font-bold text-slate-400 block">Period ID</span>
                    <span id="periodId" class="text-xs font-black text-amber-400">2026090901</span>
                </div>
                <div class="text-right">
                    <span class="text-[10px] uppercase font-bold text-slate-400 block">Time Remaining</span>
                    <span id="timerTxt" class="text-sm font-black text-rose-500 animate-pulse">00:15</span>
                </div>
            </div>

            <div id="gameStatus" class="text-center py-4 bg-slate-900/50 rounded-2xl border border-slate-800/80 space-y-1">
                <span class="text-[10px] font-bold uppercase text-slate-400 tracking-wider">Status</span>
                <h3 id="statusText" class="text-sm font-black text-amber-300 uppercase">Place Your Bets Now!</h3>
            </div>

            <!-- 6 Color Betting Buttons Grid -->
            <div class="grid grid-cols-3 gap-2 pt-2">
                <button onclick="selectColor('green')" id="btn-green" class="color-btn py-3 rounded-2xl bg-emerald-600/90 hover:bg-emerald-500 font-black text-xs uppercase tracking-wider border border-emerald-400/40 shadow-lg flex flex-col items-center gap-0.5 transition-all cursor-pointer">
                    <span>Green</span>
                    <span class="text-[9px] text-emerald-200">2x</span>
                </button>
                <button onclick="selectColor('violet')" id="btn-violet" class="color-btn py-3 rounded-2xl bg-purple-600/90 hover:bg-purple-500 font-black text-xs uppercase tracking-wider border border-purple-400/40 shadow-lg flex flex-col items-center gap-0.5 transition-all cursor-pointer">
                    <span>Violet</span>
                    <span class="text-[9px] text-purple-200">4.5x</span>
                </button>
                <button onclick="selectColor('red')" id="btn-red" class="color-btn py-3 rounded-2xl bg-rose-600/90 hover:bg-rose-500 font-black text-xs uppercase tracking-wider border border-rose-400/40 shadow-lg flex flex-col items-center gap-0.5 transition-all cursor-pointer">
                    <span>Red</span>
                    <span class="text-[9px] text-rose-200">2x</span>
                </button>
                <button onclick="selectColor('indigo')" id="btn-indigo" class="color-btn py-3 rounded-2xl bg-indigo-600/90 hover:bg-indigo-500 font-black text-xs uppercase tracking-wider border border-indigo-400/40 shadow-lg flex flex-col items-center gap-0.5 transition-all cursor-pointer">
                    <span>Indigo</span>
                    <span class="text-[9px] text-indigo-200">3x</span>
                </button>
                <button onclick="selectColor('yellow')" id="btn-yellow" class="color-btn py-3 rounded-2xl bg-amber-500 hover:bg-amber-400 font-black text-xs uppercase tracking-wider border border-amber-300/40 shadow-lg flex flex-col items-center gap-0.5 text-slate-950 transition-all cursor-pointer">
                    <span>Yellow</span>
                    <span class="text-[9px] text-slate-900 font-bold">5x</span>
                </button>
                <button onclick="selectColor('orange')" id="btn-orange" class="color-btn py-3 rounded-2xl bg-orange-600/90 hover:bg-orange-500 font-black text-xs uppercase tracking-wider border border-orange-400/40 shadow-lg flex flex-col items-center gap-0.5 transition-all cursor-pointer">
                    <span>Orange</span>
                    <span class="text-[9px] text-orange-200">3.5x</span>
                </button>
            </div>
        </div>

        <div class="glass-panel rounded-3xl p-4 space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-slate-300 uppercase">Bet Amount (₹)</span>
            </div>

            <input type="number" id="betAmount" value="10" class="w-full bg-[#05070a] border border-slate-800 rounded-2xl px-4 py-3 text-xs text-white font-bold focus:outline-none focus:border-amber-500 transition-all">

            <div class="space-y-1.5">
                <div class="grid grid-cols-4 gap-1.5">
                    <button onclick="setBet(10)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-slate-300 border border-slate-700/50 cursor-pointer">10</button>
                    <button onclick="setBet(20)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-slate-300 border border-slate-700/50 cursor-pointer">20</button>
                    <button onclick="setBet(50)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-slate-300 border border-slate-700/50 cursor-pointer">50</button>
                    <button onclick="setBet(100)" class="quick-btn py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-slate-300 border border-slate-700/50 cursor-pointer">100</button>
                </div>

                <div class="grid grid-cols-4 gap-1.5">
                    <button onclick="setBet(300)" class="quick-btn py-1.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-amber-400 border border-slate-700/50 cursor-pointer">300</button>
                    <button onclick="setBet(500)" class="quick-btn py-1.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-amber-400 border border-slate-700/50 cursor-pointer">500</button>
                    <button onclick="setBet(700)" class="quick-btn py-1.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-amber-400 border border-slate-700/50 cursor-pointer">700</button>
                    <button onclick="setBet(1000)" class="quick-btn py-1.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-[11px] font-bold text-amber-400 border border-slate-700/50 cursor-pointer">1000</button>
                </div>
            </div>

            <button id="betBtn" onclick="placeBet()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-slate-950 font-black text-xs uppercase tracking-widest shadow-lg shadow-amber-500/30 transition-all cursor-pointer">CONFIRM BET (RED)</button>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyC4d_UnCWkmKc3D65HjxvAGvJ4A5GXFIQQ", authDomain: "nexuswin-aa829.firebaseapp.com", databaseURL: "https://nexuswin-aa829-default-rtdb.firebaseio.com", projectId: "nexuswin-aa829", storageBucket: "nexuswin-aa829.firebasestorage.app", messagingSenderId: "865579357605", appId: "1:865579357605:web:7af15e869ce54756a8844c" };
        
        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getDatabase(app);
        } catch(e) {}

        let currentUser = null, userBalance = 0, userWinningBalance = 0, userTurnover = 0, userGameControl = 'normal';
        let selectedColor = 'red', currentBetPlaced = null, timeLeft = 15, isRoundLocked = false;
        let roundHistoryCount = 0;

        // --- WEB AUDIO SYSTEM ---
        let audioCtx = null;
        function getAudioContext() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch(e) {}
            return audioCtx;
        }

        window.playCustomSound = function(actionType) {
            try {
                const ctx = getAudioContext();
                if(!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                const now = ctx.currentTime;

                if (actionType === 'chip') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.09);
                    osc.start(now);
                    osc.stop(now + 0.09);
                } else if (actionType === 'color') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.setValueAtTime(750, now + 0.05);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (actionType === 'start') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.linearRampToValueAtTime(300, now + 0.1);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (actionType === 'back') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(350, now);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                }
            } catch(e) {}
        }

        window.playSound = function(type) {
            try {
                const ctx = getAudioContext();
                if(!ctx) return;
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();
                osc.connect(gainNode);
                gainNode.connect(ctx.destination);
                const now = ctx.currentTime;

                if (type === 'tick') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    gainNode.gain.setValueAtTime(0.1, now);
                    gainNode.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.12);
                    osc.frequency.setValueAtTime(783.99, now + 0.24);
                    osc.frequency.setValueAtTime(1046.50, now + 0.36);
                    gainNode.gain.setValueAtTime(0.5, now);
                    gainNode.gain.linearRampToValueAtTime(0.01, now + 0.7);
                    osc.start(now);
                    osc.stop(now + 0.7);
                } else if (type === 'lose') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.linearRampToValueAtTime(80, now + 0.4);
                    gainNode.gain.setValueAtTime(0.35, now);
                    gainNode.gain.linearRampToValueAtTime(0.01, now + 0.45);
                    osc.start(now);
                    osc.stop(now + 0.45);
                }
            } catch(e) {}
        }

        window.showVipToast = function(title, message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if(!container) return;
            container.innerHTML = ''; 
            
            const toast = document.createElement('div');
            let bgGradient = 'linear-gradient(135deg, #0f172aee 0%, #090d16ee 100%)';
            let borderColor = '#334155';
            let icon = '🎨';
            let titleColor = 'text-white';

            if(type === 'success') {
                bgGradient = 'linear-gradient(135deg, #064e3b 0%, #022c22 100%)';
                borderColor = '#10b981';
                icon = '🏆';
                titleColor = 'text-emerald-400';
            } else if(type === 'error') {
                bgGradient = 'linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%)';
                borderColor = '#f43f5e';
                icon = '🚨';
                titleColor = 'text-rose-400';
            }

            toast.className = `pointer-events-auto flex items-center gap-4 px-5 py-4 rounded-3xl shadow-2xl backdrop-blur-2xl border-2 vip-toast-enter max-w-sm w-full mx-4`;
            toast.style.background = bgGradient;
            toast.style.borderColor = borderColor;
            toast.style.boxShadow = `0 20px 40px rgba(0,0,0,0.6), 0 0 20px ${borderColor}44`;
            
            toast.innerHTML = `
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl bg-black/30 border border-white/10 shrink-0 shadow-inner">
                    ${icon}
                </div>
                <div class="flex-1">
                    <div class="text-[13px] font-black uppercase tracking-wider ${titleColor}">${title}</div>
                    <div class="text-xs font-semibold text-slate-200 mt-0.5">${message}</div>
                </div>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('vip-toast-enter');
                toast.classList.add('vip-toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        if(auth) {
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    currentUser = user;
                    setupDatabaseListener(user.uid);
                } else {
                    try {
                        const cred = await signInAnonymously(auth);
                        currentUser = cred.user;
                        setupDatabaseListener(currentUser.uid);
                    } catch(err) {
                        userBalance = 0;
                        updateBalanceUI();
                    }
                }
            });
        } else {
            userBalance = 0;
            updateBalanceUI();
        }

        function setupDatabaseListener(uid) {
            try {
                const userRef = ref(db, 'users/' + uid);
                onValue(userRef, (snap) => {
                    if(snap.exists()) {
                        const val = snap.val();
                        userBalance = val.balance !== undefined ? val.balance : 0;
                        userWinningBalance = Number(val.winningBalance || 0);
                        userTurnover = Number(val.turnover || 0);
                        if(val.gameControls && val.gameControls.color_prediction) {
                            userGameControl = val.gameControls.color_prediction;
                        }
                    } else {
                        set(userRef, { balance: 0, winningBalance: 0, turnover: 0 });
                        userBalance = 0;
                    }
                    updateBalanceUI();
                }, () => { updateBalanceUI(); });
            } catch(e) { updateBalanceUI(); }
        }

        function updateBalanceUI() {
            const balEl = document.getElementById('userBalance');
            if(balEl) {
                if (typeof userBalance === 'number') {
                    balEl.innerText = `₹${userBalance > 999999 ? userBalance.toExponential(2) : userBalance.toFixed(2)}`;
                } else {
                    balEl.innerText = `₹${userBalance}`;
                }
            }
        }

        window.goBack = function() {
            playCustomSound('back');
            window.location.href = 'dashboard.html';
        }

        window.setBet = (amt) => { 
            if(!isRoundLocked) {
                playCustomSound('chip');
                document.getElementById('betAmount').value = amt; 
            }
        }

        window.selectColor = (color) => {
            if(isRoundLocked) return;
            playCustomSound('color');
            selectedColor = color;
            ['green', 'violet', 'red', 'indigo', 'yellow', 'orange'].forEach(c => {
                const btn = document.getElementById(`btn-${c}`);
                if(btn) btn.classList.remove('ring-4', 'ring-amber-400', 'scale-105');
            });
            const activeBtn = document.getElementById(`btn-${color}`);
            if(activeBtn) activeBtn.classList.add('ring-4', 'ring-amber-400', 'scale-105');
            const betBtn = document.getElementById('betBtn');
            if(betBtn) betBtn.innerText = `CONFIRM BET (${color.toUpperCase()})`;
        }
        selectColor('red');

        window.placeBet = async function() {
            if(isRoundLocked) return;
            playCustomSound('start');

            let betInput = document.getElementById('betAmount');
            let bet = betInput ? parseFloat(betInput.value) : 10;
            let numericBal = Number(userBalance);

            if(!bet || bet < 10) { 
                showVipToast("Invalid Bet", "Minimum bet amount is ₹10", "error"); 
                return; 
            }
            if(bet > numericBal) { 
                showVipToast("Low Balance", "Insufficient wallet balance to place bet!", "error"); 
                return; 
            }
            if(timeLeft <= 3) { 
                showVipToast("Round Locking", "Please wait for the next round!", "error"); 
                return; 
            }

            let turnoverIncrement = bet * 0.30;
            userBalance = numericBal - bet;
            userTurnover += turnoverIncrement;
            updateBalanceUI();

            currentBetPlaced = { amount: bet, color: selectedColor };
            
            if(currentUser && db) {
                try {
                    await update(ref(db, `users/${currentUser.uid}`), { 
                        balance: userBalance,
                        turnover: userTurnover
                    });
                } catch(e) {}
            }

            showVipToast("Bet Placed", `Successfully placed ₹${bet} on ${selectedColor.toUpperCase()}`, "success");
            const statusTxt = document.getElementById('statusText');
            if(statusTxt) statusTxt.innerText = `Bet Placed: ₹${bet} on ${selectedColor.toUpperCase()}`;
            
            const betBtn = document.getElementById('betBtn');
            if(betBtn) {
                betBtn.disabled = true;
                betBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        // 15-Second Timer Loop with Admin Control & House Protection
        setInterval(async () => {
            timeLeft--;
            
            if(timeLeft <= 3 && timeLeft >= 0) {
                isRoundLocked = true;
                if(timeLeft > 0) playSound('tick');
            }

            if(timeLeft < 0) {
                timeLeft = 15;
                isRoundLocked = false;
                roundHistoryCount++;

                if(currentBetPlaced && currentUser) {
                    let userWins = false;

                    if (userGameControl === 'win') {
                        userWins = true;
                    } else if (userGameControl === 'lose') {
                        userWins = false;
                    } else {
                        // House Edge / Admin Protection: कम बार जिताने वाला स्मार्ट एल्गोरिदम
                        let betAmt = currentBetPlaced.amount;
                        if (betAmt <= 50) {
                            userWins = (roundHistoryCount % 4 === 0) ? (Math.random() < 0.35) : (Math.random() < 0.15);
                        } else if (betAmt > 50 && betAmt <= 300) {
                            userWins = (roundHistoryCount % 6 === 0) ? (Math.random() < 0.25) : (Math.random() < 0.08);
                        } else {
                            userWins = (roundHistoryCount % 10 === 0) ? (Math.random() < 0.15) : (Math.random() < 0.03);
                        }
                    }

                    let winningColor = userWins ? currentBetPlaced.color : getDifferentColor(currentBetPlaced.color);

                    if(userWins) {
                        let multiplier = getMultiplier(winningColor);
                        let totalPayout = currentBetPlaced.amount * multiplier;
                        let netProfit = totalPayout - currentBetPlaced.amount;
                        let allowableWinning = netProfit > 0 ? netProfit * 0.40 : 0;

                        userBalance = Number(userBalance) + totalPayout;
                        userWinningBalance += allowableWinning;
                        updateBalanceUI();

                        try {
                            await update(ref(db, `users/${currentUser.uid}`), { 
                                balance: userBalance,
                                winningBalance: userWinningBalance
                            });
                        } catch(e) {}

                        playSound('win');
                        showVipToast("Big Win!", `Won ₹${totalPayout.toFixed(2)}! Color: ${winningColor.toUpperCase()}`, "success");
                        const statusTxt = document.getElementById('statusText');
                        if(statusTxt) statusTxt.innerHTML = `<span class="text-emerald-400">🎉 WON! Color: ${winningColor.toUpperCase()} | ₹${totalPayout.toFixed(2)}</span>`;
                    } else {
                        playSound('lose');
                        showVipToast("Round Lost", `Color landed on ${winningColor.toUpperCase()}. Better luck next time!`, "error");
                        const statusTxt = document.getElementById('statusText');
                        if(statusTxt) statusTxt.innerHTML = `<span class="text-rose-400">💥 LOSS! Color landed on ${winningColor.toUpperCase()}</span>`;
                    }
                    currentBetPlaced = null;
                } else {
                    const statusTxt = document.getElementById('statusText');
                    if(statusTxt) statusTxt.innerText = "Round Completed! Place bet for next round.";
                }

                const betBtn = document.getElementById('betBtn');
                if(betBtn) {
                    betBtn.disabled = false;
                    betBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }

            let formattedTime = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
            const timerTxt = document.getElementById('timerTxt');
            if(timerTxt) timerTxt.innerText = formattedTime;
        }, 1000);

        function getMultiplier(color) {
            switch(color) {
                case 'green': return 2;
                case 'violet': return 4.5;
                case 'red': return 2;
                case 'indigo': return 3;
                case 'yellow': return 5;
                case 'orange': return 3.5;
                default: return 2;
            }
        }

        function getDifferentColor(excludeColor) {
            const colors = ['green', 'violet', 'red', 'indigo', 'yellow', 'orange'];
            const filtered = colors.filter(c => c !== excludeColor);
            return filtered[Math.floor(Math.random() * filtered.length)];
        }
    </script>
</body>
</html>
