<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusWin - Gaming Lobby</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .glass-panel {
            background: rgba(13, 17, 28, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        #toastBox {
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen pb-32">

    <!-- Toast Notification Box -->
    <div id="toastBox" class="fixed top-5 left-1/2 -translate-x-1/2 z-[100] bg-rose-600 text-white px-5 py-3 rounded-2xl shadow-2xl text-xs font-bold tracking-wide transform -translate-y-20 opacity-0 pointer-events-none flex items-center gap-2 border border-rose-400/30">
        <span>⚠️</span> <span id="toastMsg">Error message here</span>
    </div>

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-50 glass-panel border-b border-slate-800/80 px-4 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-rose-600 to-orange-500 flex items-center justify-center font-black text-white shadow-lg shadow-rose-500/30 border border-white/10">NW</div>
            <div>
                <h2 id="userName" class="text-xs font-bold text-white tracking-wide">Nexus Player</h2>
                <span class="text-[10px] text-emerald-400 font-semibold flex items-center gap-1">● Live Secured</span>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 bg-slate-900/90 border border-slate-800/80 px-3.5 py-1.5 rounded-full shadow-inner">
                <span class="text-[10px] uppercase font-bold text-slate-400">Bal:</span>
                <span id="userBalance" class="text-xs font-black text-emerald-400">₹0.00</span>
            </div>
            <button onclick="openAdminCheck()" id="adminNavBtn" class="hidden px-3 py-1.5 rounded-xl bg-purple-600/20 border border-purple-500/30 text-purple-300 font-bold text-[10px] uppercase tracking-wider">Admin</button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto p-4 space-y-5">

        <!-- Wallet Action Cards -->
        <div class="grid grid-cols-2 gap-3">
            <button onclick="window.location.href='deposit.html'" class="glass-panel hover:bg-slate-900/90 p-4 rounded-3xl flex flex-col items-center justify-center gap-2 transition-all active:scale-95 border-emerald-500/20 group">
                <div class="w-11 h-11 rounded-2xl bg-emerald-500/10 flex items-center justify-center text-emerald-400 group-hover:scale-110 transition-transform border border-emerald-500/20">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
                </div>
                <span class="text-xs font-bold text-slate-200 uppercase tracking-wider">Deposit</span>
            </button>
            <button onclick="window.location.href='withdrawal.html'" class="glass-panel hover:bg-slate-900/90 p-4 rounded-3xl flex flex-col items-center justify-center gap-2 transition-all active:scale-95 border-indigo-500/20 group">
                <div class="w-11 h-11 rounded-2xl bg-indigo-500/10 flex items-center justify-center text-indigo-400 group-hover:scale-110 transition-transform border border-indigo-500/20">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"/></svg>
                </div>
                <span class="text-xs font-bold text-slate-200 uppercase tracking-wider">Withdraw</span>
            </button>
        </div>
        
        <button onclick="window.location.href='history.html'" class="w-full py-3 rounded-2xl bg-slate-900 border border-slate-800 text-xs font-bold text-slate-300 hover:text-white mt-3">
            📜 View Transaction History
        </button>

        <!-- Direct Games Section (3 Games Per Row Grid) -->
        <div class="space-y-3">
            <h3 class="text-xs font-extrabold text-slate-200 uppercase tracking-widest px-1">GAMES</h3>
            <div id="gamesGridContainer" class="grid grid-cols-3 gap-2.5"></div>
        </div>

    </main>

    <!-- Firebase & Catalog Generator Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4d_UnCWkmKc3D65HjxvAGvJ4A5GXFIQQ",
            authDomain: "nexuswin-aa829.firebaseapp.com",
            databaseURL: "https://nexuswin-aa829-default-rtdb.firebaseio.com",
            projectId: "nexuswin-aa829",
            storageBucket: "nexuswin-aa829.firebasestorage.app",
            messagingSenderId: "865579357605",
            appId: "1:865579357605:web:7af15e869ce54756a8844c",
            measurementId: "G-NTZY5VKYP0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const ADMIN_EMAIL = "parii90150@gmail.com"; 
        let currentUserBalance = 0;
        let currentUserEmail = "";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserEmail = user.email || "Gamer";
                document.getElementById('userName').innerText = currentUserEmail;

                if (user.email === ADMIN_EMAIL) {
                    document.getElementById('adminNavBtn').classList.remove('hidden');
                }
                
                const userRef = ref(db, 'users/' + user.uid);

                onValue(userRef, async (snapshot) => {
                    const data = snapshot.val();
                    if(data) {
                        currentUserBalance = data.balance !== undefined ? Number(data.balance) : 100.00;
                        document.getElementById('userBalance').innerText = `₹${currentUserBalance.toFixed(2)}`;
                    } else {
                        set(userRef, { email: currentUserEmail, balance: 100.00, totalDeposit: 0.00, turnover: 0.00 });
                        currentUserBalance = 100.00;
                        document.getElementById('userBalance').innerText = `₹100.00`;
                    }
                });
            } else {
                window.location.href = "index.html";
            }
        });

        window.openAdminCheck = () => { window.location.href = "admin.html"; }

        const gamesList = [
            { 
                id: 1, name: "Lucky Jet", iconBg: "from-amber-600 via-orange-700 to-red-950", desc: "Jetpack Escape", file: "game-luckyjet.html",
                svgLogo: `<div class="flex flex-col items-center"><svg class="w-8 h-8 text-amber-300 filter drop-shadow-[0_0_8px_rgba(251,191,36,0.8)]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg><span class="text-[8px] font-black text-amber-400 tracking-wider uppercase mt-1">JET</span></div>` 
            },
            { 
                id: 2, name: "Endless Climber", iconBg: "from-cyan-600 via-blue-800 to-slate-950", desc: "Ladder Climb", file: "ladder_climber.html",
                svgLogo: `<div class="flex flex-col items-center"><svg class="w-8 h-8 text-cyan-400 filter drop-shadow-[0_0_8px_rgba(56,189,248,0.8)]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M8 2v20M16 2v20M4 6h16M4 11h16M4 16h16"/></svg><span class="text-[8px] font-black text-cyan-300 tracking-wider uppercase mt-1">CLIMBER</span></div>` 
            },
            { 
                id: 3, name: "Speed Dice", iconBg: "from-purple-700 via-indigo-900 to-black", desc: "Fast Roll", file: "game-dice.html",
                svgLogo: `<div class="flex flex-col items-center"><svg class="w-8 h-8 text-purple-300 filter drop-shadow-[0_0_8px_rgba(192,132,252,0.8)]" fill="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" fill-opacity="0.2" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="8" r="2"/><circle cx="16" cy="16" r="2"/><circle cx="12" cy="12" r="2"/></svg><span class="text-[8px] font-black text-purple-300 tracking-wider uppercase mt-1">DICE</span></div>` 
            },
            { 
                id: 4, name: "Penalty Shoot", iconBg: "from-green-600 via-emerald-900 to-slate-950", desc: "Goal Multiplier", file: "game-penalty.html",
                svgLogo: `<div class="flex flex-col items-center"><svg class="w-8 h-8 text-white filter drop-shadow-[0_0_8px_rgba(255,255,255,0.8)]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg><span class="text-[8px] font-black text-green-300 tracking-wider uppercase mt-1">GOAL</span></div>` 
            },
            { 
                id: 5, name: "Coin Flip", iconBg: "from-amber-500 via-yellow-600 to-amber-950", desc: "Heads/Tails", file: "game-coinflip.html",
                svgLogo: `<div class="flex flex-col items-center"><svg class="w-8 h-8 text-amber-200 filter drop-shadow-[0_0_8px_rgba(252,211,77,0.8)]" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill-opacity="0.3" stroke="currentColor" stroke-width="2.5"/><text x="12" y="16" font-size="12" font-weight="bold" text-anchor="middle" fill="currentColor">₹</text></svg><span class="text-[8px] font-black text-amber-200 tracking-wider uppercase mt-1">COIN</span></div>` 
            },
            { 
                id: 6, name: "Hi-Lo Switch", iconBg: "from-blue-600 via-indigo-900 to-slate-950", desc: "Card Predictor", file: "game-hilo.html",
                svgLogo: `<div class="flex flex-col items-center"><svg class="w-8 h-8 text-cyan-300 filter drop-shadow-[0_0_8px_rgba(103,232,249,0.8)]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><rect x="3" y="4" width="12" height="16" rx="2"/><rect x="9" y="4" width="12" height="16" rx="2" fill="#1e1b4b"/></svg><span class="text-[8px] font-black text-cyan-300 tracking-wider uppercase mt-1">CARDS</span></div>` 
            },
            { 
                id: 7, name: "Andar Bahar", iconBg: "from-cyan-600 via-blue-800 to-slate-950", desc: "Traditional Card", file: "game-andarbahar.html",
                svgLogo: `<div class="flex flex-col items-center"><svg class="w-8 h-8 text-cyan-300 filter drop-shadow-[0_0_8px_rgba(103,232,249,0.8)]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 8v8m-4-4h8"/></svg><span class="text-[8px] font-black text-cyan-300 tracking-wider uppercase mt-1">ANDAR</span></div>` 
            },
            { 
                id: 8, name: "Color Predict", iconBg: "from-violet-600 via-purple-800 to-slate-950", desc: "Red/Green/Violet", file: "game-colorprediction.html",
                svgLogo: `<div class="flex flex-col items-center"><svg class="w-8 h-8 text-purple-300 filter drop-shadow-[0_0_8px_rgba(216,180,254,0.8)]" fill="currentColor" viewBox="0 0 24 24"><circle cx="7" cy="12" r="4" fill="#22c55e"/><circle cx="17" cy="12" r="4" fill="#ef4444"/><circle cx="12" cy="12" r="2" fill="#a855f7"/></svg><span class="text-[8px] font-black text-purple-300 tracking-wider uppercase mt-1">PREDICT</span></div>` 
            },
            { 
                Id: 9, name: "Neon Wall Reflex", iconBg: "from-cyan-500 via-blue-600 to-slate-950", desc: "High-Speed Skill Challenge", file: "game-wallreflex.html",
                svgLogo: `<div class="flex flex-col items-center"><svg class="w-8 h-8 text-cyan-300 filter drop-shadow-[0_0_8px_rgba(6,182,212,0.8)]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg><span class="text-[8px] font-black text-cyan-300 tracking-wider uppercase mt-1">REFLEX</span></div>`
            },
            {
                Id: 10, name: "Neon Bullet Dodge", iconBg: "from-cyan-500 via-indigo-600 to-slate-950", desc: "Cyber Dodge Action", file: "game-neonbullet.html", 
                svgLogo: `<div class="flex flex-col items-center"><svg class="w-8 h-8 text-cyan-300 filter drop-shadow-[0_0_8px_rgba(6,182,212,0.8)]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg><span class="text-[8px] font-black text-cyan-300 tracking-wider uppercase mt-1">DODGE</span></div>`
            }
        ];

        window.renderGamesGrid = function() {
            const container = document.getElementById('gamesGridContainer');
            container.innerHTML = '';

            gamesList.forEach(game => {
                container.innerHTML += `
                    <div onclick="launchGame('${game.file}')" class="glass-panel rounded-2xl p-2 flex flex-col gap-1.5 hover:border-amber-500/50 cursor-pointer transition-all group">
                        <div class="h-24 rounded-xl bg-gradient-to-br ${game.iconBg} flex flex-col items-center justify-center relative overflow-hidden shadow-inner border border-white/10 group-hover:scale-[1.02] transition-transform duration-300">
                            <div class="absolute inset-0 bg-black/15"></div>
                            <div class="z-10 group-hover:scale-110 transition-transform duration-300">${game.svgLogo}</div>
                        </div>
                        <div class="px-0.5 pb-0.5">
                            <h4 class="text-[10px] font-bold text-white truncate">${game.name}</h4>
                            <p class="text-[8px] text-slate-400 font-medium truncate">${game.desc}</p>
                        </div>
                    </div>
                `;
            });
        }

        window.launchGame = (fileName) => { window.location.href = fileName; }
        renderGamesGrid();
    </script>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-panel border-t border-slate-800/80 px-2 py-3 flex items-center justify-around z-50 rounded-t-3xl">
        <button onclick="window.location.href='dashboard.html'" class="flex flex-col items-center gap-1 text-amber-500">
            <span class="text-xl">🏠</span>
            <span class="text-[9px] font-bold uppercase tracking-wider">Home</span>
        </button>
        <button onclick="window.location.href='history.html'" class="flex flex-col items-center gap-1 text-slate-400 hover:text-amber-400 transition-colors">
            <span class="text-xl">📜</span>
            <span class="text-[9px] font-bold uppercase tracking-wider">History</span>
        </button>
        <button onclick="window.location.href='vip.html'" class="flex flex-col items-center gap-1 text-slate-400 hover:text-amber-400 transition-colors">
            <span class="text-xl">👑</span>
            <span class="text-[9px] font-bold uppercase tracking-wider">VIP</span>
        </button>
        <button onclick="window.location.href='support.html'" class="flex flex-col items-center gap-1 text-slate-400 hover:text-amber-400 transition-colors">
            <span class="text-xl">🎧</span>
            <span class="text-[9px] font-bold uppercase tracking-wider">Support</span>
        </button>
        <button onclick="window.location.href='profile.html'" class="flex flex-col items-center gap-1 text-slate-400 hover:text-amber-400 transition-colors">
            <span class="text-xl">👤</span>
            <span class="text-[9px] font-bold uppercase tracking-wider">Profile</span>
        </button>
    </nav>

</body>
</html>
