<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="manifest" href="/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusWin - Login & Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .glass-panel {
            background: rgba(13, 17, 28, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }
        /* Custom VIP Popup Animation */
        @keyframes popupScale {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .popup-animate {
            animation: popupScale 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Custom VIP Modal Popup Container -->
    <div id="vipModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md hidden p-4">
        <div class="glass-panel w-full max-w-xs rounded-3xl p-6 text-center border border-slate-700/60 popup-animate shadow-2xl relative overflow-hidden">
            <div id="modalIconContainer" class="w-14 h-14 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 mx-auto flex items-center justify-center text-2xl mb-4 text-indigo-400">
                <span id="modalIcon">🎮</span>
            </div>
            <h3 id="modalTitle" class="text-sm font-black uppercase tracking-wider text-white mb-2">Notification</h3>
            <p id="modalMessage" class="text-xs text-slate-300 font-medium mb-6 leading-relaxed">Message goes here...</p>
            <button onclick="closeVipModal()" class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-extrabold text-xs uppercase tracking-wider shadow-lg shadow-indigo-600/30 transition-all active:scale-[0.98]">
                Okay, Got it
            </button>
        </div>
    </div>

    <div class="glass-panel w-full max-w-sm rounded-[2.5rem] p-8 border border-slate-800 text-center relative overflow-hidden">
        <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-indigo-600 to-violet-500 mx-auto flex items-center justify-center font-black text-2xl text-white shadow-xl shadow-indigo-600/30 border border-white/10 mb-6">NW</div>
        
        <h1 class="text-xl font-black text-white tracking-wide uppercase mb-1">NexusWin Arena</h1>
        <p id="subTitle" class="text-xs text-slate-400 font-medium mb-6">Login to your gaming account</p>

        <!-- Tab Switcher -->
        <div class="flex bg-slate-900/90 p-1 rounded-2xl border border-slate-800 mb-6">
            <button id="loginTabBtn" onclick="switchTab('login')" class="flex-1 py-2 text-xs font-extrabold uppercase rounded-xl transition-all bg-indigo-600 text-white shadow-md">Login</button>
            <button id="signupTabBtn" onclick="switchTab('signup')" class="flex-1 py-2 text-xs font-extrabold uppercase rounded-xl transition-all text-slate-400 hover:text-white">Sign Up</button>
        </div>

        <!-- Login Form -->
        <div id="loginSection" class="space-y-4">
            <div>
                <label class="block text-[10px] text-slate-400 font-bold uppercase tracking-widest text-left mb-1.5">Gmail Address</label>
                <input type="email" id="loginEmail" placeholder="name@gmail.com" class="w-full bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-xs text-white font-semibold focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-[10px] text-slate-400 font-bold uppercase tracking-widest text-left mb-1.5">Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" class="w-full bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-xs text-white font-semibold focus:outline-none focus:border-indigo-500">
            </div>
            <button onclick="loginUser()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-extrabold text-xs uppercase tracking-wider shadow-lg shadow-indigo-600/30 transition-all active:scale-[0.98]">
                Login to Dashboard
            </button>
        </div>

        <!-- Signup Form (Hidden initially) -->
        <div id="signupSection" class="space-y-4 hidden">
            <div>
                <label class="block text-[10px] text-slate-400 font-bold uppercase tracking-widest text-left mb-1.5">Gmail Address</label>
                <input type="email" id="signupEmail" placeholder="name@gmail.com" class="w-full bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-xs text-white font-semibold focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-[10px] text-slate-400 font-bold uppercase tracking-widest text-left mb-1.5">Password</label>
                <input type="password" id="signupPassword" placeholder="••••••••" class="w-full bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-xs text-white font-semibold focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-[10px] text-slate-400 font-bold uppercase tracking-widest text-left mb-1.5">Confirm Password</label>
                <input type="password" id="signupConfirmPassword" placeholder="••••••••" class="w-full bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-xs text-white font-semibold focus:outline-none focus:border-indigo-500">
            </div>
            <button onclick="signupUser()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold text-xs uppercase tracking-wider shadow-lg shadow-emerald-600/30 transition-all active:scale-[0.98]">
                Create Account
            </button>
        </div>
    </div>

    <!-- Firebase Auth Logic & VIP Popup Controller -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendEmailVerification, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4d_UnCWkmKc3D65HjxvAGvJ4A5GXFIQQ",
            authDomain: "nexuswin-aa829.firebaseapp.com",
            databaseURL: "https://nexuswin-aa829-default-rtdb.firebaseio.com",
            projectId: "nexuswin-aa829",
            storageBucket: "nexuswin-aa829.firebasestorage.app",
            messagingSenderId: "865579357605",
            appId: "1:865579357605:web:7af15e869ce54756a8844c",
            measurementId: "G-NTZY5VKYP0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // VIP Modal Helper Function
        window.showVipModal = function(title, message, type = 'error') {
            const modal = document.getElementById('vipModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalIcon = document.getElementById('modalIcon');
            const iconContainer = document.getElementById('modalIconContainer');

            modalTitle.innerText = title;
            modalMessage.innerText = message;

            if (type === 'success') {
                modalIcon.innerText = "✅";
                iconContainer.className = "w-14 h-14 rounded-2xl bg-emerald-600/20 border border-emerald-500/35 mx-auto flex items-center justify-center text-2xl mb-4 text-emerald-400";
            } else {
                modalIcon.innerText = "⚠️";
                iconContainer.className = "w-14 h-14 rounded-2xl bg-rose-600/20 border border-rose-500/35 mx-auto flex items-center justify-center text-2xl mb-4 text-rose-400";
            }

            modal.classList.remove('hidden');
        }

        window.closeVipModal = function() {
            document.getElementById('vipModal').classList.add('hidden');
        }

        window.switchTab = function(tab) {
            const loginSec = document.getElementById('loginSection');
            const signupSec = document.getElementById('signupSection');
            const loginBtn = document.getElementById('loginTabBtn');
            const signupBtn = document.getElementById('signupTabBtn');
            const subTitle = document.getElementById('subTitle');

            if (tab === 'login') {
                loginSec.classList.remove('hidden');
                signupSec.classList.add('hidden');
                loginBtn.className = "flex-1 py-2 text-xs font-extrabold uppercase rounded-xl transition-all bg-indigo-600 text-white shadow-md";
                signupBtn.className = "flex-1 py-2 text-xs font-extrabold uppercase rounded-xl transition-all text-slate-400 hover:text-white";
                subTitle.innerText = "Login to your gaming account";
            } else {
                loginSec.classList.add('hidden');
                signupSec.classList.remove('hidden');
                signupBtn.className = "flex-1 py-2 text-xs font-extrabold uppercase rounded-xl transition-all bg-emerald-600 text-white shadow-md";
                loginBtn.className = "flex-1 py-2 text-xs font-extrabold uppercase rounded-xl transition-all text-slate-400 hover:text-white";
                subTitle.innerText = "Create a new player account";
            }
        }

        window.loginUser = function() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();

            if (!email || !pass) {
                showVipModal("Missing Fields", "Please fill in all required login fields.", "error");
                return;
            }

            signInWithEmailAndPassword(auth, email, pass)
                .then(() => {
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    showVipModal("Login Failed", error.message, "error");
                });
        }

        window.signupUser = function() {
            const email = document.getElementById('signupEmail').value.trim();
            const pass = document.getElementById('signupPassword').value.trim();
            const confirmPass = document.getElementById('signupConfirmPassword').value.trim();

            if (!email || !pass || !confirmPass) {
                showVipModal("Missing Fields", "Please fill in all required registration fields.", "error");
                return;
            }

            if (pass !== confirmPass) {
                showVipModal("Password Mismatch", "The passwords you entered do not match. Please check.", "error");
                return;
            }

            createUserWithEmailAndPassword(auth, email, pass)
                .then((userCredential) => {
                    const user = userCredential.user;
                    
                    sendEmailVerification(user).then(() => {
                        set(ref(db, 'users/' + user.uid), {
                            email: email,
                            balance: 0.00,
                            createdAt: Date.now()
                        }).then(() => {
                            showVipModal("Verification Sent!", "Account created successfully! A verification link has been sent to your Gmail. Please verify before logging in.", "success");
                            signOut(auth);
                            switchTab('login');
                        });
                    });
                })
                .catch((error) => {
                    showVipModal("Registration Failed", error.message, "error");
                });
        }
    </script>
</body>
</html>
