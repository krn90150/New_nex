<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusWin - VIP Privileges</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .glass-panel {
            background: rgba(13, 17, 28, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }
        #toastBox {
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen pb-24">

    <!-- Toast Notification Box -->
    <div id="toastBox" class="fixed top-5 left-1/2 -translate-x-1/2 z-[100] bg-emerald-600 text-white px-5 py-3 rounded-2xl shadow-2xl text-xs font-bold tracking-wide transform -translate-y-20 opacity-0 pointer-events-none flex items-center gap-2 border border-emerald-400/30">
        <span>✨</span> <span id="toastMsg">Message here</span>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-panel border-b border-slate-800/80 px-4 py-4 flex items-center gap-3">
        <button onclick="window.location.href='dashboard.html'" class="w-9 h-9 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-white font-bold">←</button>
        <h1 class="text-sm font-extrabold text-white uppercase tracking-wider">VIP Privilege System</h1>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-5">
        <!-- Current VIP Card -->
        <div class="glass-panel rounded-3xl p-5 border border-amber-500/30 bg-gradient-to-br from-slate-900 via-[#0d111c] to-amber-950/20">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">👑</span>
                    <div>
                        <h2 id="currentVipTitle" class="text-sm font-extrabold text-amber-400">VIP LEVEL 1</h2>
                        <p class="text-[10px] text-slate-400">Max Withdrawal: <span id="currentMaxWd" class="text-white font-bold">₹100</span></p>
                    </div>
                </div>
                <button onclick="claimVipBonus()" id="claimBtn" class="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-[10px] uppercase tracking-wider transition-all shadow-lg shadow-amber-500/20">Claim Bonus</button>
            </div>
            
            <div class="space-y-1.5 mt-4">
                <div class="flex justify-between text-[11px] font-bold">
                    <span class="text-slate-400">Turnover Progress</span>
                    <span id="turnoverProgressText" class="text-amber-300">₹0 / ₹2,000</span>
                </div>
                <div class="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden border border-slate-800">
                    <div id="progressBar" class="bg-gradient-to-r from-amber-600 to-amber-400 h-full w-[0%] transition-all duration-500"></div>
                </div>
            </div>
        </div>

        <h3 class="text-xs font-extrabold text-slate-300 uppercase tracking-widest px-1">All 15 VIP Tiers</h3>

        <!-- VIP Tiers List -->
        <div id="vipTiersContainer" class="space-y-3"></div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-panel border-t border-slate-800/80 px-2 py-3 flex items-center justify-around z-50 rounded-t-3xl">
        <button onclick="window.location.href='dashboard.html'" class="flex flex-col items-center gap-1 text-slate-400 hover:text-amber-400 transition-colors">
            <span class="text-xl">🏠</span>
            <span class="text-[9px] font-bold uppercase tracking-wider">Home</span>
        </button>
        <button onclick="window.location.href='history.html'" class="flex flex-col items-center gap-1 text-slate-400 hover:text-amber-400 transition-colors">
            <span class="text-xl">📜</span>
            <span class="text-[9px] font-bold uppercase tracking-wider">History</span>
        </button>
        <button onclick="window.location.href='vip.html'" class="flex flex-col items-center gap-1 text-amber-500">
            <span class="text-xl">👑</span>
            <span class="text-[9px] font-bold uppercase tracking-wider">VIP</span>
        </button>
        <button onclick="window.location.href='support.html'" class="flex flex-col items-center gap-1 text-slate-400 hover:text-amber-400 transition-colors">
            <span class="text-xl">🎧</span>
            <span class="text-[9px] font-bold uppercase tracking-wider">Support</span>
        </button>
        <button onclick="window.location.href='profile.html'" class="flex flex-col items-center gap-1 text-slate-400 hover:text-amber-400 transition-colors">
            <span class="text-xl">👤</span>
            <span class="text-[9px] font-bold uppercase tracking-wider">Profile</span>
        </button>
    </nav>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4d_UnCWkmKc3D65HjxvAGvJ4A5GXFIQQ",
            authDomain: "nexuswin-aa829.firebaseapp.com",
            databaseURL: "https://nexuswin-aa829-default-rtdb.firebaseio.com",
            projectId: "nexuswin-aa829",
            storageBucket: "nexuswin-aa829.firebasestorage.app",
            messagingSenderId: "865579357605",
            appId: "1:865579357605:web:7af15e869ce54756a8844c",
            measurementId: "G-NTZY5VKYP0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const vipLevels = [
            { level: 1, turnover: 0, maxWd: 100, bonus: 1 },
            { level: 2, turnover: 2000, maxWd: 250, bonus: 2 },
            { level: 3, turnover: 5000, maxWd: 500, bonus: 4 },
            { level: 4, turnover: 10000, maxWd: 1000, bonus: 8 },
            { level: 5, turnover: 20000, maxWd: 2500, bonus: 15 },
            { level: 6, turnover: 40000, maxWd: 5000, bonus: 25 },
            { level: 7, turnover: 80000, maxWd: 10000, bonus: 40 },
            { level: 8, turnover: 150000, maxWd: 20000, bonus: 65 },
            { level: 9, turnover: 300000, maxWd: 35000, bonus: 100 },
            { level: 10, turnover: 600000, maxWd: 50000, bonus: 150 },
            { level: 11, turnover: 1200000, maxWd: 75000, bonus: 220 },
            { level: 12, turnover: 2500000, maxWd: 100000, bonus: 320 },
            { level: 13, turnover: 5000000, maxWd: 200000, bonus: 450 },
            { level: 14, turnover: 10000000, maxWd: 500000, bonus: 700 },
            { level: 15, turnover: 20000000, maxWd: 1000000, bonus: 1000 }
        ];

        let currentUserData = null;
        let currentUserId = null;
        let activeTierLevel = 1;

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toastBox');
            document.getElementById('toastMsg').innerText = msg;
            toast.className = `fixed top-5 left-1/2 -translate-x-1/2 z-[100] text-white px-5 py-3 rounded-2xl shadow-2xl text-xs font-bold tracking-wide transform transition-all duration-300 flex items-center gap-2 border ${isError ? 'bg-rose-600 border-rose-400/30' : 'bg-emerald-600 border-emerald-400/30'}`;
            toast.classList.remove('-translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 3000);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserId = user.uid;
                const userRef = ref(db, 'users/' + user.uid);
                onValue(userRef, (snapshot) => {
                    const data = snapshot.val() || {};
                    currentUserData = data;
                    const userTurnover = data.turnover || 0;

                    let currentTier = vipLevels[0];
                    let nextTier = vipLevels[1];

                    for (let i = vipLevels.length - 1; i >= 0; i--) {
                        if (userTurnover >= vipLevels[i].turnover) {
                            currentTier = vipLevels[i];
                            nextTier = vipLevels[i + 1] || vipLevels[i];
                            break;
                        }
                    }

                    activeTierLevel = currentTier.level;
                    document.getElementById('currentVipTitle').innerText = `VIP LEVEL ${currentTier.level}`;
                    document.getElementById('currentMaxWd').innerText = `₹${currentTier.maxWd.toLocaleString()}`;

                    let progressPercent = 100;
                    let progressText = "MAX LEVEL REACHED";

                    if (currentTier.level < 15) {
                        const needed = nextTier.turnover - currentTier.turnover;
                        const achieved = userTurnover - currentTier.turnover;
                        progressPercent = Math.min(100, Math.max(0, (achieved / needed) * 100));
                        progressText = `₹${userTurnover.toLocaleString()} / ₹${nextTier.turnover.toLocaleString()}`;
                    }

                    document.getElementById('turnoverProgressText').innerText = progressText;
                    document.getElementById('progressBar').style.width = `${progressPercent}%`;

                    checkClaimStatus(currentTier.bonus);
                    renderVipList(currentTier.level);
                });
            } else {
                window.location.href = "index.html";
            }
        });

        function checkClaimStatus(bonusAmount) {
            const claimBtn = document.getElementById('claimBtn');
            const lastClaimDate = currentUserData?.lastVipClaimDate || "";
            const todayStr = new Date().toDateString();

            if (lastClaimDate === todayStr) {
                claimBtn.innerText = "Claimed";
                claimBtn.disabled = true;
                claimBtn.classList.remove('bg-amber-500', 'hover:bg-amber-400');
                claimBtn.classList.add('bg-slate-800', 'text-slate-500', 'cursor-not-allowed');
            } else {
                claimBtn.innerText = `Claim ₹${bonusAmount}`;
                claimBtn.disabled = false;
                claimBtn.classList.remove('bg-slate-800', 'text-slate-500', 'cursor-not-allowed');
                claimBtn.classList.add('bg-amber-500', 'hover:bg-amber-400');
            }
        }

        window.claimVipBonus = function() {
            if (!currentUserId || !currentUserData) return;

            const todayStr = new Date().toDateString();
            if (currentUserData.lastVipClaimDate === todayStr) {
                showToast("Aap aaj ka VIP bonus pehle hi claim kar chuke hain!", true);
                return;
            }

            const currentTier = vipLevels.find(t => t.level === activeTierLevel) || vipLevels[0];
            const bonusAmount = currentTier.bonus;
            const currentBalance = Number(currentUserData.balance || 0);
            const newBalance = currentBalance + bonusAmount;

            const userRef = ref(db, 'users/' + currentUserId);
            update(userRef, {
                balance: newBalance,
                lastVipClaimDate: todayStr
            }).then(() => {
                showToast(`🎉 Badhai ho! ₹${bonusAmount} VIP bonus successfully add ho gaya hai.`);
            }).catch((error) => {
                console.error("Error claiming bonus: ", error);
                showToast("Bonus claim karne me error aaya, dobara try karein.", true);
            });
        }

        function renderVipList(activeLevel) {
            const container = document.getElementById('vipTiersContainer');
            container.innerHTML = '';

            vipLevels.forEach(tier => {
                const isCurrent = tier.level === activeLevel;
                container.innerHTML += `
                    <div class="glass-panel rounded-2xl p-3.5 flex items-center justify-between border ${isCurrent ? 'border-amber-500/80 bg-amber-500/5' : 'border-slate-800/80'}">
                        <div>
                            <div class="flex items-center gap-2">
                                <h4 class="text-xs font-extrabold ${isCurrent ? 'text-amber-400' : 'text-white'}">VIP Level ${tier.level}</h4>
                                ${isCurrent ? '<span class="bg-amber-500/20 border border-amber-500/30 text-amber-300 text-[8px] font-extrabold px-2 py-0.5 rounded-full uppercase">Current</span>' : ''}
                            </div>
                            <p class="text-[10px] text-slate-400 mt-0.5">Turnover: ₹${tier.turnover.toLocaleString()}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs font-black text-emerald-400">Max W/D: ₹${tier.maxWd.toLocaleString()}</p>
                            <p class="text-[10px] text-slate-400 font-semibold">Daily Bonus: ₹${tier.bonus}</p>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
